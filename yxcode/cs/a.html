<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标暖色粒子效果（视频背景）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden; /* 防止出现滚动条 */
            cursor: crosshair; /* 鼠标样式 */
        }

        /* 视频背景样式：铺满全屏并置于最底层 */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* 保持比例铺满，不变形 */
            z-index: 0;
            background-color: blue; /* 如果视频路径失效，会显示纯蓝背景 */
        }

        /* 画布样式：悬浮在视频上方 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }
    </style>
</head>
<body>
<!-- 背景视频：直接指定你本地的路径 -->
<video id="bgVideo" autoplay loop muted playsinline>
    <source src="file:///F:/bz/Light-Streaks-Race-Car-4K.mp4" type="video/mp4">
    <!-- 如果上面的绝对路径被浏览器拦截无法播放，你可以把 html 文件放到 F:\bz\ 目录下，
         然后删掉上面那行，取消下面这行的注释：
    <source src="Light-Streaks-Race-Car-4K.mp4" type="video/mp4">
    -->
</video>

<!-- 粒子画布 -->
<canvas id="particleCanvas"></canvas>

<script>
    // ============================
    // 鼠标暖色粒子效果
    // ============================
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    const MAX_PARTICLES = 2000;

    function createParticle(x, y) {
        if (particles.length >= MAX_PARTICLES) {
            particles.shift();
        }

        particles.push({
            x: x + (Math.random() - 0.5) * 8,
            y: y + (Math.random() - 0.5) * 8,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.8,
            size: Math.random() * 2 + 1,          // 小粒子：半径 1~3
            life: 1,
            decay: Math.random() * 0.003 + 0.0015, // 超长存留
            color: `hsl(${Math.random() * 60}, 100%, 60%)` // 暖色系
        });
    }

    let lastGenerateTime = 0;
    const GENERATE_INTERVAL = 120; // 生成间隔时间（毫秒）

    function tryGenerate(x, y) {
        const now = performance.now();
        if (now - lastGenerateTime >= GENERATE_INTERVAL) {
            lastGenerateTime = now;
            createParticle(x, y);
            if (Math.random() > 0.5) {
                createParticle(x, y);
            }
        }
    }

    // 监听鼠标移动
    window.addEventListener('mousemove', (e) => {
        tryGenerate(e.clientX, e.clientY);
    });

    // 监听触摸
    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        tryGenerate(touch.clientX, touch.clientY);
    });

    // 动画循环
    function animate() {
        // 只清除画布，不填充背景色，这样底下的视频就能透出来
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            p.size *= 0.995;

            if (p.life <= 0 || p.size <= 0.1) {
                particles.splice(i, 1);
                continue;
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
