<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫雷游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>扫雷游戏</h1>
        <div class="game-info">
            <div class="info-item">
                <span class="label">剩余地雷:</span>
                <span id="mine-count">0</span>
            </div>
            <div class="info-item">
                <span class="label">已打开:</span>
                <span id="opened-count">0</span>
            </div>
            <div class="info-item">
                <button id="restart-btn">重新开始</button>
            </div>
        </div>
        <div class="game-settings">
            <div class="setting-item">
                <label for="size-input">游戏大小:</label>
                <input type="number" id="size-input" min="5" max="20" value="10">
            </div>
            <div class="setting-item">
                <label for="mine-count-input">地雷数量:</label>
                <input type="number" id="mine-count-input" min="1" max="100" value="10">
            </div>
            <div class="setting-item">
                <button id="start-btn">开始游戏</button>
            </div>
        </div>
        <div id="game-board"></div>
        <div id="game-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
