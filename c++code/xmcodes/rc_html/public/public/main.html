<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息管理系统</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录');
                window.location.href = 'index.html';
                return;
            }
            validateUserSession();
        });
        async function validateUserSession() {
            try {
                const response = await fetch('/api/check-auth', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                const result = await response.json();
                if (result.success) {
                    initPage(result);
                } else {
                    logout();
                }
            } catch (error) {
                console.error('验证会话失败:', error);
                logout();
            }
        }
        function initPage(userInfo) {
            const username = userInfo.username || localStorage.getItem('username') || '用户';
            const userRole = userInfo.userRole || localStorage.getItem('userRole') || 'user';
            localStorage.setItem('username', username);
            localStorage.setItem('userRole', userRole);
            document.getElementById('currentUser').textContent = `欢迎，${username}${userRole === 'admin' ? ' (管理员)' : ''}`;
            if (userRole === 'admin') {
                initAdminFeatures();
            }
            loadData();
        }
        function initAdminFeatures() {
            try {
                const adminSection = document.getElementById('admin-section');
                if (adminSection) adminSection.style.display = 'block';
                const userManagement = document.getElementById('user-management');
                if (userManagement) userManagement.style.display = 'block';
                const adminSettings = document.getElementById('admin-settings');
                if (adminSettings) adminSettings.style.display = 'block';
                const advancedActions = document.getElementById('advanced-actions');
                if (advancedActions) advancedActions.style.display = 'block';

            } catch (error) {
                console.error('初始化管理员功能时出错:', error);
            }
        }
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            localStorage.removeItem('token');
            localStorage.removeItem('userRole');
            window.location.href = 'index.html';
        }
        function showSection(sectionId) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                section.style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            const activeNavItem = document.querySelector(`.nav-item[onclick="showSection('${sectionId}')"]`);
            if (activeNavItem) {
                activeNavItem.classList.add('active');
            }
        }
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = 'none';
            }
        }
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加数据';
            document.getElementById('dataForm').reset();
            document.getElementById('dataModal').style.display = 'block';
        }
        function showChangePasswordModal() {
            document.getElementById('passwordForm').reset();
            document.getElementById('passwordModal').style.display = 'block';
        }
        function showNotice() {
            document.getElementById('noticeModal').style.display = 'block';
            loadNoticeContent();
        }
        async function loadNoticeContent() {
            try {
                const response = await fetch('/api/notice', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('noticeContent').textContent = result.data;
                } else {
                    document.getElementById('noticeContent').textContent = '无法加载公告内容';
                }
            } catch (error) {
                console.error('加载公告失败:', error);
                document.getElementById('noticeContent').textContent = '系统正常运行中，如有问题请联系管理员。';
            }
        }
    </script>
    <div class="main-container">
        <div class="header">
            <h1>信息管理系统</h1>
            <div class="user-info">
                <span id="currentUser">欢迎，用户</span>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="content">
            <div class="sidebar">
                <div class="nav-item active" onclick="showSection('data-management')">
                    📊 数据管理
                </div>
                <div class="nav-item" onclick="showSection('data-analysis')">
                    📈 数据分析
                </div>
                <div class="nav-item" onclick="showSection('system-settings')">
                    ⚙️ 系统设置
                </div>
                <div class="nav-item" onclick="showNotice()">
                    📢 系统公告
                </div>
                <!-- 管理员特有菜单项 -->
                <div class="nav-item" id="admin-section" onclick="showSection('admin-panel')" style="display: none;">
                    🔒 管理员面板
                </div>
                <div class="nav-item" id="user-management" onclick="manageUsers()" style="display: none;">
                    👥 用户管理
                </div>
            </div>
            <div class="main-content">
                <div id="data-management" class="section">
                    <h2>数据管理</h2>
                    <div class="search-bar">
                        <input type="text" class="search-input" id="searchId" placeholder="序号">
                        <input type="text" class="search-input" id="searchName" placeholder="姓名">
                        <input type="text" class="search-input" id="searchGender" placeholder="性别">
                        <input type="text" class="search-input" id="searchIdCard" placeholder="身份证号">
                        <input type="text" class="search-input" id="searchBirth" placeholder="出生日期">
                        <input type="text" class="search-input" id="searchLocation" placeholder="地点">
                        <input type="text" class="search-input" id="searchAge" placeholder="年龄">
                        <button class="btn btn-primary" onclick="searchData()">搜索</button>
                        <button class="btn btn-secondary" onclick="clearSearch()">清除</button>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="showAddModal()">添加数据</button>
                        <button class="btn btn-primary" onclick="importData()">导入数据</button>
                        <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
                        <button class="btn btn-info" onclick="loadData(true)">加载数据</button>
                        <button class="btn btn-success" onclick="saveDataToFile()">保存数据</button>
                        <button class="btn btn-danger" onclick="deleteSelected()">删除选中</button>
                    </div>
                    <div class="action-buttons" id="advanced-actions" style="display: none;">
                        <button class="btn btn-warning" onclick="batchProcess()">批量处理</button>
                        <button class="btn btn-info" onclick="backupData()">备份数据</button>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th><output type="checkbox" id="selectAll"></th>
                                    <th>序号</th>
                                    <th>姓名</th>
                                    <th>性别</th>
                                    <th>身份证号</th>
                                    <th>出生日期</th>
                                    <th>地点</th>
                                    <th>年龄</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody">
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination">
                        <button class="btn btn-secondary" onclick="previousPage()">上一页</button>
                        <span id="pageInfo">第 1 页，共 1 页</span>
                        <button class="btn btn-secondary" onclick="nextPage()">下一页</button>
                    </div>
                </div>
                <div id="data-analysis" class="section" style="display: none;">
                    <h2>数据分析</h2>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="loadAnalysis()">刷新分析</button>
                    </div>
                    <div id="analysisContent">
                    </div>
                </div>
                <div id="system-settings" class="section" style="display: none;">
                    <h2>系统设置</h2>
                    <div class="form-grid">
                        <div>
                            <h3>用户设置</h3>
                            <button class="btn btn-primary" onclick="showChangePasswordModal()">修改密码</button>
                        </div>
                        <div>
                            <h3>数据维护</h3>
                            <button class="btn btn-secondary" onclick="cleanData()">整理数据</button>
                        </div>
                        <div id="admin-settings" style="display: none;">
                            <h3>管理员设置</h3>
                            <button class="btn btn-warning" onclick="resetSystem()">重置系统</button>
                            <button class="btn btn-info" onclick="viewLogs()">查看日志</button>
                        </div>
                    </div>
                </div>
                <div id="admin-panel" class="section" style="display: none;">
                    <h2>管理员面板</h2>
                    <div class="form-grid">
                        <div>
                            <h3>用户管理</h3>
                            <button class="btn btn-primary" onclick="manageUsers()">管理用户账户</button>
                            <button class="btn btn-warning" onclick="setAdminPassword()">设置管理员密码</button>
                        </div>
                        <div>
                            <h3>系统维护</h3>
                            <button class="btn btn-info" onclick="backupData()">备份系统数据</button>
                            <button class="btn btn-danger" onclick="cleanSystem()">清理系统缓存</button>
                        </div>
                        <div>
                            <h3>安全审计</h3>
                            <button class="btn btn-secondary" onclick="viewSecurityLogs()">查看安全日志</button>
                            <button class="btn btn-primary" onclick="auditData()">审计数据完整性</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">添加数据</h3>
            <form id="dataForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="inputId">序号</label>
                        <input type="text" id="inputId" name="序号" required>
                    </div>
                    <div class="form-group">
                        <label for="inputName">姓名</label>
                        <input type="text" id="inputName" name="姓名" required>
                    </div>
                    <div class="form-group">
                        <label for="inputGender">性别</label>
                        <select id="inputGender" name="性别">
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inputIdCard">身份证号</label>
                        <input type="text" id="inputIdCard" name="身份证号" required>
                    </div>
                    <div class="form-group">
                        <label for="inputBirth">出生日期</label>
                        <input type="date" id="inputBirth" name="出生日期">
                    </div>
                    <div class="form-group">
                        <label for="inputLocation">地点</label>
                        <input type="text" id="inputLocation" name="地点">
                    </div>
                    <div class="form-group">
                        <label for="inputAge">年龄</label>
                        <input type="number" id="inputAge" name="年龄">
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-success">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('dataModal')">取消</button>
                </div>
            </form>
        </div>
    </div>
    <div id="noticeModal" class="modal">
        <div class="modal-content">
            <h3>系统公告</h3>
            <div id="noticeContent">
            </div>
            <div class="action-buttons" style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeModal('noticeModal')">关闭</button>
            </div>
        </div>
    </div>
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>修改密码</h3>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-success">确定</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('passwordModal')">取消</button>
                </div>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
